[package]
name = "messagebox-server"
version = "1.0.0"
edition = "2021"

[dependencies]
axum = { version = "0.8", features = ["json", "query"] }
tokio = { version = "1", features = ["full"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sqlx = { version = "0.8", default-features = false, features = ["runtime-tokio-rustls", "mysql", "chrono", "macros", "migrate"] }
tower-http = { version = "0.6", features = ["cors", "timeout", "limit"] }
tower = "0.5"
chrono = { version = "0.4", features = ["serde"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "json"] }
dotenvy = "0.15"
hex = "0.4"
thiserror = "2"
parking_lot = "0.12"
signal-hook = "0.3"
form_urlencoded = "1"
async-trait = "0.1"
socketioxide = { version = "0.15", features = ["state"] }

# Shared BRC-103-over-Socket.IO subsystem (per-socket Peer sessions, verified
# identity, rooms, signed emits/broadcasts). Extracted from this server's
# hand-rolled ws.rs glue; see src/ws.rs for what stays app-side.
#
# 0.1.2 — the SAME version rust-mpc pins workspace-wide. This is not cosmetic:
# the peers that dial this server's WS (PARAGON's cosigners over the MPC relay
# lane, wallet-plane clients over the mailbox verbs) must build the BRC-103
# handshake and the signed-event contract from ONE authsocket copy (TR-011).
# Silent drift across that boundary fails closed with no error.
#
# Note what the bump does NOT deliver: src/ws.rs FORKS `server_io::attach` for
# the TS-parity failure events, so 0.1.1's server-side keepalive room re-assert
# had to be ported into that fork by hand. Every future bump must diff upstream
# `server_io` against the fork.
authsocket = { version = "0.5.0", features = ["server"] }

# BRC-103/104 auth middleware — git dep (0.1.3, WS-first connect + connect-ack
# gate), same rev as rust-mpc bins/coordinator. Built against bsv-sdk 0.4, which
# is what makes the single-copy invariant below hold.
bsv-auth-axum-middleware = { git = "https://github.com/b1narydt/bsv-auth-axum-middleware", rev = "e550229" }

# bsv-sdk — sole SDK for all auth and wallet operations. Resolved straight from
# crates.io: there is NO [patch.crates-io] redirect in this manifest, and there
# must not be one. 0.4.0 is the published line every neighbour already targets
# (rust-mpc, authsocket 0.1.2, the auth middleware rev above, bsv-wallet-toolbox
# 0.7.1), so the whole graph resolves ONE bsv-sdk copy and `WalletInterface` /
# `AuthMessage` unify across the auth boundary. Two copies means BRC-103 breaks
# in confusing ways — verify with `cargo tree -i bsv-sdk` (expect exactly one).
bsv-sdk = { version = "0.8.0", features = ["network"] }

# 0.7.1 — the sdk-0.4 alignment release, matching the rust-mpc workspace pin.
bsv-wallet-toolbox = "0.11.0"

getrandom = "0.4"
http-body-util = "0.1"

# Firebase/FCM rebuild (parity §4.3): reqwest for the FCM v1 + OAuth2 HTTP
# calls, rsa+sha2+base64 for the RS256 service-account JWT.
reqwest = { version = "0.12", features = ["json"] }
base64 = "0.22"
rsa = { version = "0.9", features = ["sha2"] }
sha2 = "0.10"
redis = { version = "1.4.1", default-features = false, features = ["tokio-comp", "tls-rustls", "tokio-rustls-comp", "tls-rustls-webpki-roots"] }
futures-util = "0.3.32"

# Per-IP HTTP rate limiting (keyed token-bucket) — the algorithm library; the
# axum middleware + trusted-proxy IP extraction live in src/ratelimit.rs.
governor = "0.10"

[dev-dependencies]
tower = { version = "0.5", features = ["util"] }
hyper = { version = "1", features = ["full"] }
testcontainers = "0.27"
testcontainers-modules = { version = "0.15", features = ["mysql", "redis"] }
uuid = { version = "1", features = ["v4"] }
# Two-instance Model B e2e (tests/backplane_e2e.rs): a real authsocket client
# (rust_socketio) driving real loopback servers + a Redis testcontainer.
authsocket = { version = "0.5.0", features = ["server", "client"] }

[profile.release]
opt-level = 3
lto = true

# Standalone package — not a member of the parent rust-mpc workspace.
# Without this, cargo walks up to rust-mpc/Cargo.toml and refuses to build.
#
# There is deliberately NO [patch.crates-io] here. This crate used to redirect
# bsv-sdk graph-wide to a b1narydt/bsv-rust-sdk git rev, because crates.io 0.3.0
# rejected protocol/basket names starting with 'p' (which broke the
# payment-request-auth protocol). That fix is published in the 0.4 line, so the
# redirect is gone: a [patch] here would make this crate unpublishable and would
# re-open the version skew the single-copy invariant above exists to prevent.
[workspace]
